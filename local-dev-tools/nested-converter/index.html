<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Nested Converter — Advanced JSON to TypeScript</title>
    <meta name="description" content="A specialized conversion tool for extremely deep nested JSON structures. Handles recursion, circular references, and massive payloads.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-bg"></div>

    <header>
        <div class="title-badge">Professional Grade</div>
        <h1>Deep Nested Converter</h1>
        <p class="subtitle">Architect-level utility for converting complex, multi-layered JSON into optimized TypeScript types with recursion and circular detection.</p>
    </header>

    <main>
        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Source Payload (JSON)
                </div>
                <div class="depth-indicator" id="input-depth">Max Depth: 0</div>
            </div>
            <textarea id="json-input" placeholder="Drop your deep JSON structure here..." spellcheck="false"></textarea>
        </section>

        <section class="panel" style="border-left: 1px solid var(--border-dim);">
            <div class="panel-header">
                <div class="panel-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    TypeScript Definition
                </div>
                <button class="btn-convert" id="btn-copy">Copy Code</button>
            </div>
            <div class="output-area" id="ts-output"></div>
        </section>
    </main>

    <div class="controls">
        <label class="control-item">
            <input type="checkbox" id="check-recursive" checked>
            <span>Auto-Recursion</span>
        </label>
        <label class="control-item">
            <input type="checkbox" id="check-comments" checked>
            <span>Layer Annotations</span>
        </label>
        <label class="control-item">
            <input type="checkbox" id="check-strict" checked>
            <span>Strict Types</span>
        </label>
        <div style="width: 1px; height: 20px; background: var(--border-dim);"></div>
        <button class="btn-convert" id="btn-load-sample">Load Deep Sample</button>
    </div>

    <div id="toast" style="position: fixed; top: 2rem; right: 2rem; background: var(--accent); color: #000; padding: 0.75rem 1.5rem; border-radius: 4px; font-weight: 700; display: none; z-index: 1000;">Copied!</div>

    <script src="app.js"></script>
</body>
</html>

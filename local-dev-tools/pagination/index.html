<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination Response — Infinite Scroll & Paging Type Generator</title>
    <meta name="description" content="Generate optimized TypeScript definitions for Offset, Cursor, and Page-based pagination. Support for GitHub, Stripe, and Notion API patterns.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="badge-pagination">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"></path></svg>
            Data Flow Optimization
        </div>
        <h1>Pagination Response</h1>
        <p class="subtitle">Architect-grade paging types for lists, tables, and infinite scrolling feeds.</p>
    </header>

    <main>
        <aside class="config-panel">
            <div class="section-title">Paging Strategy</div>
            <div class="type-selector">
                <button class="type-btn active" data-type="offset">Offset / Limit</button>
                <button class="type-btn" data-type="cursor">Cursor Based</button>
                <button class="type-btn" data-type="page">Page / Size</button>
                <button class="type-btn" data-type="infinite">Infinite Scroll</button>
            </div>

            <div class="section-title">Common Presets</div>
            <div class="input-group">
                <select id="preset-select">
                    <option value="custom">Custom Configuration</option>
                    <option value="github">GitHub API (Link Header)</option>
                    <option value="stripe">Stripe (Has More)</option>
                    <option value="notion">Notion (Next Cursor)</option>
                </select>
            </div>

            <div class="section-title">Data Entity</div>
            <div class="input-group">
                <label>Generic Type Name</label>
                <input type="text" id="entity-name" value="T" placeholder="e.g. User, Product">
            </div>

            <div class="section-title">Interface Name</div>
            <div class="input-group">
                <label>Response Wrapper</label>
                <input type="text" id="wrapper-name" value="PaginatedResponse">
            </div>
        </aside>

        <section class="output-container">
            <div class="code-card">
                <div class="card-header">
                    <h3>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                        TypeScript Interface
                    </h3>
                    <button class="btn-copy" id="btn-copy-ts">Copy</button>
                </div>
                <div class="code-area" id="output-ts"></div>
            </div>

            <div class="code-card">
                <div class="card-header">
                    <h3>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        Mock Response Example
                    </h3>
                    <button class="btn-copy" id="btn-copy-json">Copy</button>
                </div>
                <div class="code-area" id="output-json"></div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script src="app.js"></script>
</body>
</html>
